# Nginx-configuratie voor webontwikkelaar.nl.
# Wordt bij de build naar dist/ gekopieerd en in Coolify ingeladen met:
#   include /usr/share/nginx/html/nginx-site.conf;

# Kies de homepage op basis van de eerste voorkeurstaal van de browser.
# nl, nl-NL en nl-BE krijgen de Nederlandse versie, de rest de Engelse.
map $http_accept_language $home_page {
    default       /en/index.html;
    "~*^\s*nl\b"  /index.html;
}

server {
    root /usr/share/nginx/html;

    # Alleen de homepage zelf hangt af van de taal
    location = / {
        add_header Vary Accept-Language;
        try_files $home_page =404;
    }

    location / {
        index index.html index.htm;
        try_files $uri $uri.html $uri/index.html $uri/index.htm $uri/ =404;
    }

    # Dit configuratiebestand staat in de webroot, maar hoeft niet publiek te zijn
    location = /nginx-site.conf {
        return 404;
    }

    # Handle 404 errors
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Handle server errors (50x)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
